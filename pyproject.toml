[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "python-multipart",
    "supabase",
    "httpx",
    "redis",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "boto3",
    "botocore",
    "qdrant-client",
    "openai",
    # Non-PDF extraction. The extras are not optional: without them
    # docx/pptx/xlsx fail to convert. No [pdf] extra — PDFs go through
    # pymupdf4llm, not markitdown.
    "markitdown[docx,pptx,xlsx,xls,outlook]",
    "websockets",
    "aiofiles",
    "python-magic",
    "resend",
    # PDF extraction, chunk sizing and reranking
    "pymupdf",
    "pymupdf4llm",
    "pymupdf-layout",
    "tiktoken",
    "flashrank",
    "fpdf2",
    "python-docx",
]

[tool.pyrefly]
# Modules are imported as `src.foo.bar`, so the import root is the project
# directory. Without this, the layout heuristic picks `src/` as the root and
# every `from src...` import in the codebase reports as a missing module.
search-path = ["."]
